# fly.toml app configuration file generated for done-manager on 2026-06-27T09:07:07-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'done-manager'
primary_region = 'iad'
kill_signal = 'SIGTERM'
swap_size_mb = 512


[build]

[deploy]
  release_command = '/app/bin/migrate'

[env]
  PHX_HOST = 'donemanager.com'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

[[vm]]
  memory = '512mb'
  cpus = 1
